server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep trailing-slash redirects relative, so they work behind an HTTPS proxy.
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The static search index that the search dialog downloads.
    location = /api/search {
        default_type application/json;
    }

    location /_next/static/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
