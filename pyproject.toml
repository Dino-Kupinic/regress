[project]
name = "regress"
version = "0.1.0"
description = "Improve AI-generated tests using mutation testing as an objective feedback loop."
authors = [
    { name = "Dino-Kupinic", email = "dinokupinic2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
regress = "regress:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs real Vitest and Stryker against the examples project (slow)"]

[tool.semantic_release]
# Releases are cut by .github/workflows/release.yml from Conventional Commits on main.
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/regress/__init__.py:__version__"]
build_command = "uv lock"
assets = ["uv.lock"]
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.changelog]
mode = "update"
