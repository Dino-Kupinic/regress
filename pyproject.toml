[project]
name = "regress"
version = "0.1.0"
description = "Improve AI-generated tests using mutation testing as an objective feedback loop."
authors = [
    { name = "Dino-Kupinic", email = "dinokupinic2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
regress = "regress:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs real Vitest and Stryker against the examples project (slow)"]
