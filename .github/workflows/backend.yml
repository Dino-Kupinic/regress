name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: uv sync --frozen --python 3.13
      - run: bun install --frozen-lockfile
        working-directory: examples
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen pytest
      - run: bash -n deploy/start.sh

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag regress-ci .
      - name: Check readiness and access without login
        shell: bash
        run: |
          docker run --detach --name regress-ci --publish 8080:8080 \
            --env REGRESS_PUBLIC_ORIGIN=https://regress.example \
            --env OPENAI_API_KEY=ci-placeholder regress-ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          curl --fail --silent http://127.0.0.1:8080/
          curl --fail --silent http://127.0.0.1:8080/api/health
      - name: Check unprivileged mutation toolchain
        run: |
          docker exec --workdir /data/project regress-ci gosu regress /app/.venv/bin/python -c '
          import os
          from pathlib import Path
          from regress.project import load_project
          from regress.vitest import run_vitest
          from regress.stryker import run_stryker
          assert os.getuid() != 0
          assert Path.home() == Path("/home/regress")
          project = load_project(Path("src/cart.ts"))
          tests = run_vitest(project, Path("/data/project/.regress/smoke/vitest"), "baseline")
          assert tests.success
          result = run_stryker(project, Path("/data/project/.regress/smoke/stryker"), 1)
          assert result.mutants
          print("Passing tests:", tests.total, "Mutation score:", result.score)
          '
      - name: Container logs
        if: always()
        run: docker logs regress-ci || true
      - name: Stop container
        if: always()
        run: docker rm --force regress-ci || true
