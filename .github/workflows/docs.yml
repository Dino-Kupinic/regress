name: Docs

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag regress-docs-ci docs
      - name: Check the served site
        shell: bash
        run: |
          docker run --detach --name regress-docs-ci --publish 8081:8080 regress-docs-ci
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8081/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8081/
          curl --fail --silent --output /dev/null http://127.0.0.1:8081/docs/getting-started/installation/
          curl --fail --silent --output /dev/null http://127.0.0.1:8081/api/search
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/missing-page/)" = 404
      - name: Stop container
        if: always()
        run: docker rm --force regress-docs-ci || true
