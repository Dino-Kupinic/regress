server {
    listen 8080;
    server_name _;
    root /app/web/build/client;

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host localhost:8765;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
